<!DOCTYPE html>
<html>
    <head>
        <title>Maze Game</title>
        <meta charset="UTF-8"/>
        <link href="style.css" rel="stylesheet" />
    </head>
    <body>
        <h1>Maze Game</h1>
        <p>The goal of this game is to find the treasure chest, plus all the keys needed to open it. Click the directional buttons to move.</p>
        <p>(If you don't see a little green person in the center, try refreshing until they appear.)</p>
            <div id="grid">
                <canvas id="canvas" width="210" height="210">This is the game canvas.</canvas> 
            </div>
            <div class="directional-buttons">
                <button id="ButtonNorth" disabled>↑</button><br>
                <button id="ButtonWest">←</button><div class="center-square"></div><button id="ButtonEast" disabled>→</button><br>
                <button id="ButtonSouth" disabled>↓</button>
            </div>
            <div id="roomstats"></div>
            <div id="text"></div>
            <button id="use-torch" disabled>Use torch</button>
            <div id="torch-count"></div>
            <button id="toggle-arrow-keys" disabled>Toggle arrow key input</button>
            <div id="arrow-keys-status"></div>
            <div class="hidden">
            <img
                id="source"
                src="mazesheet.png"
                width="120"
                height="60" />
            </div>
        <script src="script.js"></script>
    </body>
</html>
