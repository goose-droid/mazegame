<!DOCTYPE html>
<html>
    <head>
        <title>Maze Game</title>
        <meta charset="UTF-8"/>
        <link href="style.css" rel="stylesheet" />
    </head>
    <body>
        <div id="wrapper">
            <h1>Maze Game</h1>
            <main>
                <div id="left-column">
                    <div id="minimap">
                        <canvas id="canvas" width="210" height="210">This is the game canvas.</canvas> 
                    </div>
                    <div id="buttonsarea">
                        <div id="location"></div>
                        <div id="main-buttons">
                            <div id="torch-stuff">
                                <div>
                                    <button id="use-torch" class="fullbutton" disabled>Refill <u>L</u>amp</button><div id="torch-count"></div>
                                </div>
                                <div class="flex">
                                    <button id="toggle-arrow-keys" class="fullbutton" >Toggle keyboard input</button><div id="arrow-keys-status"></div>
                                </div>
                            </div>
                            <div class="directional-buttons">
                                <button id="ButtonNorth" disabled>↑</button><br>
                                <button id="ButtonWest">←</button><div class="center-square"></div><button id="ButtonEast" disabled>→</button><br>
                                <button id="ButtonSouth" disabled>↓</button>
                            </div>
                        </div>
                        
                    </div>
                </div>
                <div id="right-column">
                    <canvas id="right-canvas" width="210" height="210">This is the extra canvas</canvas>
                    <div id="text"></div>
                    <button id="continue" class="hidden fullbutton" disabled>Continue</button> 
                </div>
            </main>
        </div>
        <div class="hidden">
        <img
            id="source"
            src="mazesheet.png"
            width="120"
            height="60" />
        <img id="key" src="key.webp">
        <img id="chest00" src="chest00.webp">
        <img id="chest01" src="chest01.webp">
        <img id="chest02" src="chest02.webp">
        <img id="chest03" src="chest03.webp">
        <img id="chest04" src="chest04.webp">
        <img id="chestopen" src="chestopen.webp">
        <img id="character" src="mazegameperson.png">
        <img id="uparrow"  src="uparrow.png">
        <img id="downarrow" src="downarrow.png">
        </div>
        <script src="script.js"></script>
    </body>
</html>
